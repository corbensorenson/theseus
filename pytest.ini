[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = archive data deprecated resource_pantry runtime target
addopts = -p no:asyncio
markers =
    public_source: test is clean-checkout safe and requires no ignored local evidence
    local_evidence: test requires governed ignored reports, checkpoints, data, or runtime state
    accelerator: test may initialize MLX/Metal or spawn accelerator-native work and requires the external host watchdog
